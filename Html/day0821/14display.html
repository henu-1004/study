<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 14display.html </title>
    <style>
        span{ display: block; }   
        div{ display: inline; }
         
        div .my1{
            width:250px; height:100px;
            border:2px;
            border-style:solid;
            background-color:beige;
            border-color: darkblue;
            margin-bottom: 7px;
        }
        .my2{
            width:250px; height:100px;
            border:2px;
            border-style:solid;
            background-color:pink;
            border-color: red;
            margin-top: 15px;
        }
        .my3{
            width:250px; height:100px;
            border:2px;
            border-style:solid;
            background-color:green;
            border-color: purple;
            margin-top: 15px;
        }
     </style>
</head>
<body>
    <br>인라인 요소를 블럭요소 변환 출력</br>
    <span> 1 HTML5, CSS3 </span>
    <span> 2 JavaScript </span>
    <span> 3 GitHub </span>
    <span> 4 Vue.js </span>
    <span> 5 Node.js </span>
    <span> 6 React.js </span>

     <br>block 요소를 inline요소로 변환 출력</br>
     <div> 1 HTML5, CSS3 </div>
     <div> 2 JavaScript</div>
     <div> 3 GitHub</div>
     <div> 4 Vue.js </div>
     <div> 5 Node.js </div>
     <div> 6 React.js  </div> 
     <p></p>

     <br>그냥연습 test
     <div class="my1" style="border: 1px;">divbox1</div>
     <div class="my2">divbox2</div>
     <div class="my3">divbox3</div>
</body>
</html>
